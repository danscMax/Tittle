name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel an in-flight run when a newer commit supersedes it (a push burst no longer
# leaves a tail of doomed runs grinding to completion). PRs and main isolate by ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6  # SDK band comes from global.json

      # No lockfiles (RID-native packages don't play with RestorePackagesWithLockFile), so cache the
      # global package folder keyed on the single CPM manifest instead of setup-dotnet's lockfile cache.
      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Tittle.sln

      - name: Build
        run: dotnet build Tittle.sln --no-restore -c Release

      # Avalonia.Headless runs without a display server — no xvfb needed.
      - name: Test
        run: dotnet test Tittle.sln --no-build -c Release --verbosity normal

      # Exercise the same script developers use locally. The fast untrimmed/no-R2R profile is
      # intentional here: this gate verifies single-file bundling, process startup and artifact
      # shape on every main/PR build; tag releases separately exercise the optimized profile.
      - name: Portable single-file startup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        run: |
          ./build.ps1 -NoOpen -NoReadyToRun -NoTrim `
            -PublishTimeoutSeconds 900 -OutDir dist/ci-portable

          $files = @(Get-ChildItem dist/ci-portable -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Tittle.exe') {
            throw "Expected exactly one Tittle.exe; found: $($files.Name -join ', ')"
          }

          $process = Start-Process -FilePath $files[0].FullName -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Portable executable exited during startup (code $($process.ExitCode))."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6  # SDK band comes from global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Verify formatting
        run: dotnet format Tittle.sln --verify-no-changes --verbosity diagnostic
